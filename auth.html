<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SecureBank | Login / Signup</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
body {
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, #2563eb, #1e40af);
}
.auth-box {
  background: white; width: 100%; max-width: 420px;
  padding: 40px; border-radius: 14px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.25);
}
h2 { text-align: center; margin-bottom: 24px; color: #1e293b; font-size: 22px; }
.form-group { margin-bottom: 18px; }
label { font-weight: 600; display: block; margin-bottom: 6px; font-size: 14px; color: #374151; }
input {
  width: 100%; padding: 12px 14px;
  border-radius: 8px; border: 1px solid #d1d5db;
  font-size: 14px; transition: border 0.2s;
}
input:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
button {
  width: 100%; padding: 13px;
  background: #2563eb; color: white;
  border: none; border-radius: 8px;
  font-size: 15px; font-weight: 600; cursor: pointer;
  margin-top: 8px; transition: background 0.2s;
}
button:hover { background: #1e40af; }
button:disabled { background: #93c5fd; cursor: not-allowed; }
.switch { text-align: center; margin-top: 18px; font-size: 14px; color: #6b7280; }
.switch span { color: #2563eb; cursor: pointer; font-weight: 600; }
.switch span:hover { text-decoration: underline; }
.hidden { display: none; }
.error { color: #ef4444; font-size: 13px; margin-top: 8px; text-align: center; }
.success { color: #10b981; font-size: 13px; margin-top: 8px; text-align: center; }
.logo-area { text-align: center; margin-bottom: 30px; }
.logo-area .icon { font-size: 48px; }
.logo-area h1 { font-size: 24px; color: #2563eb; font-weight: 800; }
</style>
</head>
<body>
<div class="auth-box">
  <div class="logo-area">
    <div class="icon">🏦</div>
    <h1>SecureBank</h1>
  </div>

  <!-- LOGIN -->
  <div id="loginBox">
    <h2>Welcome Back</h2>
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="loginEmail" placeholder="you@example.com" required>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="loginPassword" placeholder="Enter your password" required>
    </div>
    <button onclick="login()" id="loginBtn">Login</button>
    <div id="loginMsg"></div>
    <div class="switch">New here? <span onclick="showSignup()">Create account</span></div>
  </div>

  <!-- SIGNUP -->
  <div id="signupBox" class="hidden">
    <h2>Create Account</h2>
    <div class="form-group">
      <label>Full Name</label>
      <input type="text" id="signupName" placeholder="John Doe" required>
    </div>
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="signupEmail" placeholder="you@example.com" required>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="signupPassword" placeholder="Min 6 characters" required>
    </div>
    <button onclick="signup()" id="signupBtn">Create Account</button>
    <div id="signupMsg"></div>
    <div class="switch">Already have an account? <span onclick="showLogin()">Login</span></div>
  </div>
</div>

<script>
  // If already logged in, redirect
  if (sessionStorage.getItem("userId")) {
    window.location.href = "dashboard.html";
  }

  function showSignup() {
    document.getElementById("loginBox").classList.add("hidden");
    document.getElementById("signupBox").classList.remove("hidden");
    document.getElementById("loginMsg").textContent = "";
  }

  function showLogin() {
    document.getElementById("signupBox").classList.add("hidden");
    document.getElementById("loginBox").classList.remove("hidden");
    document.getElementById("signupMsg").textContent = "";
  }

  function setMsg(id, msg, isError = true) {
    const el = document.getElementById(id);
    el.textContent = msg;
    el.className = isError ? "error" : "success";
  }

  async function login() {
    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;
    const btn = document.getElementById("loginBtn");

    if (!email || !password) { setMsg("loginMsg", "Please fill in all fields."); return; }

    btn.disabled = true; btn.textContent = "Logging in...";

    try {
      const res = await fetch("api/login.php", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (data.success) {
        sessionStorage.setItem("userId", data.userId);
        sessionStorage.setItem("userName", data.name);
        sessionStorage.setItem("userEmail", data.email);
        window.location.href = "dashboard.html";
      } else {
        setMsg("loginMsg", data.message || "Invalid credentials.");
      }
    } catch (e) {
      setMsg("loginMsg", "Server error. Please try again.");
    }
    btn.disabled = false; btn.textContent = "Login";
  }

  async function signup() {
    const name = document.getElementById("signupName").value.trim();
    const email = document.getElementById("signupEmail").value.trim();
    const password = document.getElementById("signupPassword").value;
    const btn = document.getElementById("signupBtn");

    if (!name || !email || !password) { setMsg("signupMsg", "Please fill in all fields."); return; }
    if (password.length < 6) { setMsg("signupMsg", "Password must be at least 6 characters."); return; }

    btn.disabled = true; btn.textContent = "Creating account...";

    try {
      const res = await fetch("api/signup.php", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, email, password })
      });
      const data = await res.json();
      if (data.success) {
        setMsg("signupMsg", "Account created! Please login.", false);
        setTimeout(showLogin, 1500);
      } else {
        setMsg("signupMsg", data.message || "Signup failed.");
      }
    } catch (e) {
      setMsg("signupMsg", "Server error. Please try again.");
    }
    btn.disabled = false; btn.textContent = "Create Account";
  }

  // Allow Enter key
  document.addEventListener("keydown", e => {
    if (e.key === "Enter") {
      if (!document.getElementById("loginBox").classList.contains("hidden")) login();
      else signup();
    }
  });
</script>
</body>
</html>
